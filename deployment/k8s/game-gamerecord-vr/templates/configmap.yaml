apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gamerecord-vr.name" . }}
  namespace: {{ .Values.namespace }}
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Warning",
          "Grpc.Net.Client.Balancer": "Warning",
          "Grpc.Net.Client.Balancer.DnsResolver": "Debug",
          "Tgs.GameRecord.VRGaming.Messages.ManualMessageHandler": "Information",
          "Tgs.GameRecord.VRGaming.Messages.ScheduleMessageHandler": "Warning",
          "Tgs.GameRecord.VRGaming.Core.ApplicationServices.HandleRecordCommandService": "Warning"
        }
      },
      "GameRecordInfo": {
        "GameProviderCode": "VR",
        "GameProviderConfiguration": "VRConfiguration",
        "HangfirePrefix": "gamerecord-vr-hangfire:",
        "HangfireLocking": "gamerecord-vr-locking:",
        "IntervalMinutes": 20,
        "IntervalMinutesMax": 1440,
        "IntervalMinutesMinimum": 1
      },
      "GameRecord": {
        "GameCommandClientBaseUrl": "http://game-gamecommand/",
        "GameInterfaceClientBaseUrl": "dns:///game-gameinterface-vr:9090/",
        "GameRecordHandleClientBaseUrl": "http://game-gamerecord-handle/"
      }
    }
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:

    processors:
      batch:

    exporters:
      otlp:
        endpoint: "$NODE_IP:4317"
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "tgs"

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces: 
          receivers: [otlp]
          processors:
            - batch
          exporters: [otlp]
        metrics:
          receivers: [otlp]
          exporters: [prometheus]
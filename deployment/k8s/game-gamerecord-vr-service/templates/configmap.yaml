apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gamerecord-vr-service.name" . }}
  namespace: {{ .Values.namespace }}
data:
  appsettings.json: |
    {
      "GameRecordInfo": {
        "GameProviderCode": "VR",
        "GameProviderConfiguration": "VRConfiguration",
        "IntervalMinutes": 10,
        "IntervalMinutesMax": 1440,
        "IntervalMinutesMinimum": 1
      },
      "GameRecord": {
        "GameProvidersBaseUrl": "http://game-gameproviders/",
        "GameCommandClientBaseUrl": "http://game-gamecommand/",
        "GameRecordSchedulesBaseUrl": "http://game-gamerecordschedules:9090/"
      }
    }
  monitor.settings.json: |
    {
      "Metrics": {
        "MetricCount": "1"
      },
      "Logging":{
        "Console": {
          "FormatterName": "json"
        },
        "LogLevel": {
          "Default": "Warning",
          "Microsoft": "Warning",
          "Microsoft.Diagnostics": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      }
    }

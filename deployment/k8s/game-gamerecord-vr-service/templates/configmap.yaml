apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gamerecord-vr-service.name" . }}
  namespace: {{ .Values.namespace }}
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Warning"
        }
      },
      "GameRecordInfo": {
        "GameProviderCode": "VR",
        "GameProviderConfiguration": "VRConfiguration",
        "IntervalMinutes": 10,
        "IntervalMinutesMax": 1440,
        "IntervalMinutesMinimum": 1
      },
      "GameRecord": {
        "GameProvidersBaseUrl": "http://game-gameproviders/",
        "GameCommandClientBaseUrl": "http://game-gamecommand/",
        "GameRecordSchedulesBaseUrl": "http://game-gamerecordschedules:9090/"
      }
    }
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:

    processors:
      batch:

    exporters:
      otlp:
        endpoint: "$NODE_IP:4317"
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "tgs"

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces: 
          receivers: [otlp]
          processors:
            - batch
          exporters: [otlp]
        metrics:
          receivers: [otlp]
          exporters: [prometheus]